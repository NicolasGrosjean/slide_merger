---
name: Frontend CI

on:
    push:
        branches:
          - main
    pull_request: {}
    workflow_dispatch: {}

jobs:
    lint_and_test:
        name: frontend lint and test
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json
          - name: Install dependencies
            run: npm ci
            working-directory: frontend
          - name: Prepare report directory
            run: mkdir -p report
          - name: Run tests
            run: npm test -- --watch=false --reporters=junit --output-file=../report/junit.xml
            working-directory: frontend
          - name: Archive the test results
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: frontend-test-report
                path: report
                if-no-files-found: warn
