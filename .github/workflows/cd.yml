---
name: Build and push docker images

on:
    # Trigger automatically on tags
    push:
        tags:
          - '*'
    # Trigger manually with setting version
    workflow_dispatch:
        inputs:
            tag:
                description: Image version
                required: true
                type: string

jobs:
    build_and_push:
        name: Build and push ${{ matrix.component }} image
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                component:
                  - backend
                  - cli
        env:
            IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/slide_merger_${{ matrix.component }}
            IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        steps:
          - name: Check out repository
            uses: actions/checkout@v4

          - name: Log in to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Build and push image
            uses: docker/build-push-action@v6
            with:
                context: ./${{ matrix.component }}
                file: ./${{ matrix.component }}/Dockerfile
                push: true
                tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
