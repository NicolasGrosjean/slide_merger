---
services:
    backend:
        container_name: slide_merger_backend
        image: docker.io/nicolasgrosjean38/slide_merger_backend:0.0.2
        user: 0:0   # TODO Fix volume mount write permission issue to remove this
        environment:
          - HOST=0.0.0.0
          - ROOT_DATA_DIRECTORY=/data
        networks:
          - backend_network
        ports:
          - 8899:8899
        volumes:
          - ./backend/settings.yaml:/app/settings.yaml
          - ./data:/data

    cli:
        container_name: slide_merger_cli
        image: docker.io/nicolasgrosjean38/slide_merger_cli:0.0.2
        depends_on:
          - backend
        environment:
          - API_BASE_URL=http://backend:8899
        networks:
          - backend_network
        volumes:
          - ./cli/settings.yaml:/app/settings.yaml

    frontend:
        container_name: slide_merger_frontend
        image: docker.io/nicolasgrosjean38/slide_merger_frontend:0.0.2
        depends_on:
          - backend
        ports:
          - 4200:80
        networks:
          - backend_network

networks:
    backend_network:
